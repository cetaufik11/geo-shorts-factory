<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #08101e;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #fff;
    position: relative;
  }

  /* GPU Stage Container */
  #viewport-stage {
    position: absolute;
    top: 0; left: 0;
    width: 3000px;
    height: 3000px;
    transform-origin: 0 0;
    will-change: transform;
    transition: transform 1.65s cubic-bezier(0.65, 0, 0.35, 1);
    z-index: 2;
  }

  /* Layer 1: High-res Hardware Accelerated Base Map */
  #base-map-img {
    position: absolute;
    top: 0; left: 0;
    width: 3000px;
    height: 3000px;
    display: block;
    user-select: none;
    pointer-events: none;
  }

  /* Layer 2: Vector Overlay (Only Highlighted Countries + Arc + Beacons) */
  #vector-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 3000px;
    height: 3000px;
    pointer-events: none;
  }

  .target-country {
    fill: transparent;
    stroke: transparent;
    stroke-width: 0px;
    transition: all 0.6s ease;
  }

  .target-country.active-jp {
    fill: #ff4757 !important;
    stroke: #ffffff !important;
    stroke-width: 5px !important;
    filter: drop-shadow(0 0 35px #ff4757) drop-shadow(0 0 15px #ff6b81);
  }

  .target-country.active-de {
    fill: #2ed573 !important;
    stroke: #ffffff !important;
    stroke-width: 5px !important;
    filter: drop-shadow(0 0 35px #2ed573) drop-shadow(0 0 15px #7bed9f);
  }

  /* Flight Trajectory Arc */
  .flight-arc {
    fill: none;
    stroke: #ffd32a;
    stroke-width: 6px;
    stroke-dasharray: 16 12;
    filter: drop-shadow(0 0 25px #ffd32a);
    animation: dashAnim 1.4s linear infinite;
  }
  @keyframes dashAnim {
    to { stroke-dashoffset: -56; }
  }

  /* City Beacons */
  .city-beacon {
    r: 16;
    stroke-width: 4;
    stroke: #fff;
  }
  .city-beacon.jp { fill: #ff4757; filter: drop-shadow(0 0 25px #ff4757); }
  .city-beacon.de { fill: #ffa502; filter: drop-shadow(0 0 25px #ffa502); }

  /* UI Layer (HUD, Cards, Text) */
  .ui-layer {
    position: absolute;
    top: 0; left: 0;
    width: 1080px; height: 1920px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 90px 60px;
    pointer-events: none;
  }

  /* Top Category Pill */
  .top-badge-wrap { text-align: center; }
  .top-badge {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    padding: 16px 50px;
    border-radius: 50px;
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: linear-gradient(135deg, #ff4757, #ff6b81);
    box-shadow: 0 10px 40px rgba(255, 71, 87, 0.5);
    border: 2px solid rgba(255, 255, 255, 0.4);
  }

  /* Floating HUD Info Panel */
  .hud-panel {
    width: 100%;
    min-height: 480px;
    background: rgba(8, 14, 25, 0.85);
    border: 3px solid rgba(255, 255, 255, 0.22);
    border-radius: 40px;
    padding: 40px 50px;
    backdrop-filter: blur(35px);
    box-shadow: 0 30px 80px rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    overflow: hidden;
    transform: translateY(40px);
    opacity: 0;
    transition: all 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .hud-panel.active {
    transform: translateY(0);
    opacity: 1;
  }

  .hud-panel.winner {
    background: linear-gradient(135deg, rgba(46, 213, 115, 0.25), rgba(8, 14, 25, 0.92));
    border-color: #2ed573;
    box-shadow: 0 0 75px rgba(46, 213, 115, 0.5);
  }

  .hud-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .hud-country {
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .hud-flag {
    width: 150px;
    height: 100px;
    border-radius: 16px;
    object-fit: cover;
    box-shadow: 0 8px 25px rgba(0,0,0,0.6);
  }
  .hud-title {
    font-size: 58px;
    font-weight: 900;
    letter-spacing: 1px;
  }
  .hud-badge {
    padding: 10px 28px;
    border-radius: 18px;
    font-size: 30px;
    font-weight: 800;
    background: rgba(255, 255, 255, 0.12);
    color: #cbd5e1;
  }
  .hud-panel.winner .hud-badge {
    background: #2ed573;
    color: #05070e;
    font-weight: 900;
    box-shadow: 0 0 25px rgba(46, 213, 115, 0.7);
  }

  .hud-body {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-top: 10px;
  }
  .hud-stat-lbl {
    font-size: 34px;
    color: #94a3b8;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .hud-stat-val {
    font-size: 84px;
    font-weight: 900;
    font-family: 'Arial Black', Impact, sans-serif;
    color: #ffffff;
    letter-spacing: -1px;
  }
  .hud-panel.winner .hud-stat-val {
    color: #2ed573;
    text-shadow: 0 0 40px rgba(46, 213, 115, 0.6);
  }

  .hud-bar-bg {
    width: 100%;
    height: 20px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    overflow: hidden;
    margin-top: 24px;
  }
  .hud-bar-fill {
    height: 100%;
    width: 0%;
    border-radius: 10px;
    background: linear-gradient(90deg, #1e90ff, #70a1ff);
    transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .hud-panel.winner .hud-bar-fill {
    background: linear-gradient(90deg, #2ed573, #7bed9f);
    box-shadow: 0 0 20px rgba(46, 213, 115, 0.8);
  }

  /* Bottom Viral Subtitle Bar */
  .bottom-sub-bar {
    background: rgba(6, 12, 22, 0.8);
    border: 3px solid rgba(255, 211, 42, 0.7);
    border-radius: 32px;
    padding: 30px 40px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.85);
    backdrop-filter: blur(25px);
  }
  .sub-text {
    font-size: 46px;
    font-weight: 900;
    color: #ffd32a;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 15px rgba(0,0,0,0.9);
  }

  /* Confetti Canvas */
  #confetti-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 1080px; height: 1920px;
    z-index: 20;
    pointer-events: none;
  }
</style>
<script src="assets/d3.min.js"></script>
<script src="assets/jp_de_features.js"></script>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<!-- GPU Hardware Accelerated Viewport Stage -->
<div id="viewport-stage">
  <!-- Pre-rendered High-Res Base Map Texture -->
  <img id="base-map-img" src="assets/world_base_3000.png" />
  
  <!-- Fast Vector Overlay (Only 4 elements: Japan, Germany, Arc, Beacons) -->
  <svg id="vector-overlay" viewBox="0 0 3000 3000">
    <path id="hl-jp" class="target-country"></path>
    <path id="hl-de" class="target-country"></path>
    <path id="flight-arc" class="flight-arc"></path>
    <circle class="city-beacon jp" cx="2658.2" cy="1182.8"></circle>
    <circle class="city-beacon de" cx="1611.1" cy="986.8"></circle>
  </svg>
</div>

<div class="ui-layer">
  <!-- Top Category Pill -->
  <div class="top-badge-wrap">
    <div id="badge-text" class="top-badge">🌍 CONTINENTAL FLIGHT 🌍</div>
  </div>

  <!-- Floating HUD Info Card -->
  <div style="flex: 1; display: flex; align-items: flex-end; margin-bottom: 40px;">
    <div id="hud-panel" class="hud-panel active">
      <div class="hud-header">
        <div class="hud-country">
          <img id="hud-flag" src="assets/flag_japan.png" class="hud-flag" />
          <div id="hud-name" class="hud-title">JAPAN vs GERMANY</div>
        </div>
        <div id="hud-badge" class="hud-badge">GLOBAL ARENA</div>
      </div>
      <div class="hud-body">
        <div id="hud-stat-lbl" class="hud-stat-lbl">Target: Eurasia Flight</div>
        <div id="hud-stat-val" class="hud-stat-val">BATTLE</div>
      </div>
      <div class="hud-bar-bg">
        <div id="hud-bar-fill" class="hud-bar-fill" style="width: 100%;"></div>
      </div>
    </div>
  </div>

  <!-- Subtitle Bar -->
  <div class="bottom-sub-bar">
    <div id="sub-text" class="sub-text">Which country actually gives you a better life?</div>
  </div>
</div>

<script>
  // Setup SVG paths for Japan and Germany
  const projection = d3.geoMercator().scale(475).translate([1500, 1500]);
  const pathGen = d3.geoPath().projection(projection);

  d3.select('#hl-jp').attr('d', pathGen(jpFeature));
  d3.select('#hl-de').attr('d', pathGen(deFeature));

  // Flight Arc between Tokyo and Berlin
  const tokyo = [2658.2, 1182.8];
  const berlin = [1611.1, 986.8];
  const ctrl = [(tokyo[0] + berlin[0])/2, Math.min(tokyo[1], berlin[1]) - 300];
  const arcD = `M ${tokyo[0]} ${tokyo[1]} Q ${ctrl[0]} ${ctrl[1]} ${berlin[0]} ${berlin[1]}`;
  document.getElementById('flight-arc').setAttribute('d', arcD);

  // GPU Flight Function
  const stage = document.getElementById('viewport-stage');
  function flyCamera(tx, ty, scale) {
    stage.style.transform = `translate3d(${tx}px, ${ty}px, 0) scale(${scale})`;
  }

  function highlightCountry(code) {
    document.getElementById('hl-jp').className.baseVal = 'target-country' + (code === 'JP' ? ' active-jp' : '');
    document.getElementById('hl-de').className.baseVal = 'target-country' + (code === 'DE' ? ' active-de' : '');
  }

  function updateHud(flagSrc, name, badgeText, statLbl, statVal, barPercent, isWinner=false) {
    const p = document.getElementById('hud-panel');
    p.classList.remove('active');
    setTimeout(() => {
      document.getElementById('hud-flag').src = flagSrc;
      document.getElementById('hud-name').textContent = name;
      document.getElementById('hud-badge').textContent = badgeText;
      document.getElementById('hud-stat-lbl').textContent = statLbl;
      document.getElementById('hud-stat-val').textContent = statVal;
      document.getElementById('hud-bar-fill').style.width = barPercent;
      if(isWinner) {
        p.classList.add('winner');
      } else {
        p.classList.remove('winner');
      }
      p.classList.add('active');
    }, 250);
  }

  // Confetti Blast
  const cCanvas = document.getElementById('confetti-canvas');
  const cCtx = cCanvas.getContext('2d');
  cCanvas.width = 1080; cCanvas.height = 1920;
  let confetti = [];
  function blastConfetti() {
    confetti = [];
    const colors = ['#2ed573', '#7bed9f', '#ffd32a', '#ffffff', '#70a1ff'];
    for(let i=0; i<100; i++) {
      confetti.push({
        x: 540 + (Math.random()-0.5)*400, y: 1100 + (Math.random()-0.5)*200,
        vx: (Math.random()-0.5)*22, vy: -Math.random()*22 - 6,
        color: colors[Math.floor(Math.random()*colors.length)],
        size: Math.random()*14 + 6, alpha: 1, rot: Math.random()*360
      });
    }
  }
  function drawConfetti() {
    cCtx.clearRect(0,0,1080,1920);
    confetti.forEach((c, i) => {
      c.x += c.vx; c.y += c.vy; c.vy += 0.7; c.alpha -= 0.016; c.rot += 10;
      if(c.alpha > 0) {
        cCtx.save();
        cCtx.translate(c.x, c.y);
        cCtx.rotate((c.rot * Math.PI)/180);
        cCtx.fillStyle = c.color;
        cCtx.globalAlpha = Math.max(0, c.alpha);
        cCtx.fillRect(-c.size/2, -c.size/2, c.size, c.size*1.4);
        cCtx.restore();
      } else {
        confetti.splice(i, 1);
      }
    });
    requestAnimationFrame(drawConfetti);
  }
  drawConfetti();

  // Initial State: Wide Overview
  flyCamera(-911, 8, 0.68);

  // --- TIMELINE ---
  // 0.0s: Scene 1 (Hook) - Wide Eurasian View
  // 4.63s: Scene 2 (Salary)
  setTimeout(() => {
    flyCamera(-4776, -1616, 2.0);
    highlightCountry('JP');
    document.getElementById('badge-text').textContent = '💰 ROUND 1: SALARY 💰';
    document.getElementById('sub-text').textContent = 'Japan averages thirty-two hundred dollars!';
    updateHud('assets/flag_japan.png', 'JAPAN 🇯🇵', 'MONTHLY NET', 'Average Income', '$3,200', '71%');
  }, 4630);

  // 7.43s: Camera glides across continent to GERMANY!
  setTimeout(() => {
    flyCamera(-2843, -1322, 2.1);
    highlightCountry('DE');
    document.getElementById('sub-text').textContent = 'Germany takes the lead with $4,500!';
    updateHud('assets/flag_germany.png', 'GERMANY 🇩🇪', '🏆 WINNER', 'Average Income', '$4,500', '100%', true);
    blastConfetti();
  }, 7430);

  // 12.77s: Scene 3 (Work-Life Balance) - Glides to JAPAN
  setTimeout(() => {
    flyCamera(-4776, -1616, 2.0);
    highlightCountry('JP');
    document.getElementById('badge-text').textContent = '⏰ ROUND 2: WORK-LIFE ⏰';
    document.getElementById('sub-text').textContent = 'Japan clocks in over 1,600 hours a year!';
    updateHud('assets/flag_japan.png', 'JAPAN 🇯🇵', 'WORKLOAD', 'Annual Working Hours', '1,607 hrs', '100%');
  }, 12770);

  // 15.77s: Glides to GERMANY
  setTimeout(() => {
    flyCamera(-2843, -1322, 2.1);
    highlightCountry('DE');
    document.getElementById('sub-text').textContent = 'Germans work 260 fewer hours per year!';
    updateHud('assets/flag_germany.png', 'GERMANY 🇩🇪', '🏆 WINNER', 'Annual Working Hours', '1,341 hrs', '83%', true);
    blastConfetti();
  }, 15770);

  // 22.06s: Scene 4 (Safety) - Starts at GERMANY
  setTimeout(() => {
    flyCamera(-2843, -1322, 2.1);
    highlightCountry('DE');
    document.getElementById('badge-text').textContent = '🛡️ ROUND 3: SAFETY 🛡️';
    document.getElementById('sub-text').textContent = 'Germany ranks #20 in global safety!';
    updateHud('assets/flag_germany.png', 'GERMANY 🇩🇪', 'GLOBAL RANK', 'Safety Index', '#20', '65%');
  }, 22060);

  // 24.66s: Glides to JAPAN
  setTimeout(() => {
    flyCamera(-4776, -1616, 2.0);
    highlightCountry('JP');
    document.getElementById('sub-text').textContent = 'Japan destroys Germany with ultra-low crime rate!';
    updateHud('assets/flag_japan.png', 'JAPAN 🇯🇵', '🏆 WINNER (TOP 10)', 'Safety Index', '#9', '95%', true);
    blastConfetti();
  }, 24660);

  // 29.91s: Scene 5 (Final Verdict) - Wide Overview
  setTimeout(() => {
    flyCamera(-911, 8, 0.68);
    highlightCountry('');
    document.getElementById('badge-text').textContent = '🔥 FINAL VERDICT 🔥';
    document.getElementById('sub-text').textContent = 'Which country are you picking? Comment below!';
    updateHud('assets/flag_japan.png', 'WHERE WOULD YOU LIVE?', 'VOTE BELOW', 'A: Japan vs B: Germany', 'YOUR CHOICE', '50%');
  }, 29910);
</script>

</body>
</html>
