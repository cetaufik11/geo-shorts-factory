name: Automated Geo Shorts Generator

on:
  schedule:
    # Runs automatically every day at 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      start_id:
        description: 'Start Topic ID (1 to 30)'
        required: true
        default: '1'
      end_id:
        description: 'End Topic ID (1 to 30)'
        required: true
        default: '1'

jobs:
  build_shorts:
    name: Generate & Sync YouTube Shorts
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate YouTube Shorts
        env:
          GDRIVE_CREDENTIALS_JSON: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          START_ID="${{ github.event.inputs.start_id }}"
          END_ID="${{ github.event.inputs.end_id }}"
          if [ -z "$START_ID" ]; then
            START_ID=1
          fi
          if [ -z "$END_ID" ]; then
            END_ID=1
          fi
          echo "Rendering topics from $START_ID to $END_ID..."
          python batch_shorts_factory.py $START_ID $END_ID

      - name: Upload Videos to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-youtube-shorts
          path: output_batch/*.mp4
          retention-days: 14
          if-no-files-found: warn
